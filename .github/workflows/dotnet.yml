name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore BinanceBotWpf.sln

    - name: Check code formatting
      run: dotnet format BinanceBotWpf.sln --verify-no-changes --verbosity normal

    - name: Build
      run: dotnet build BinanceBotWpf.sln --no-restore

    - name: Run tests with code coverage
      run: dotnet test BinanceBotWpf.Tests/BinanceBotWpf.Tests.csproj --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Check for vulnerable packages
      run: dotnet list BinanceBotWpf.sln package --vulnerable --include-transitive 2>&1 | findstr /C:"has no vulnerable packages" /C:"vulnerable" /C:"critical" /C:"high" /C:"moderate" || echo "No vulnerabilities found"
